# Pipeline-ul de integrare continuă (CI).
#
# La fiecare push pe main și la fiecare pull request, GitHub pornește o mașină
# virtuală curată (runner), descarcă repo-ul și rulează verificările de mai jos.
# Dacă un pas eșuează, rularea e marcată ca eșuată lângă commit.

# Numele afișat în pagina „Actions" a repo-ului.
name: ci

# Când pornește pipeline-ul.
on:
  push:
    branches: [main]
  pull_request:

# Drepturile tokenului pe care GitHub îl dă automat fiecărei rulări.
# Implicit ar fi mai largi; aici sunt reduse la citirea codului.
permissions:
  contents: read

jobs:
  # Verificările serviciului api: lint, formatare, teste.
  api:
    # Sistemul de operare al runner-ului.
    runs-on: ubuntu-24.04
    # Folderul în care rulează comenzile „run" ale acestui job.
    defaults:
      run:
        working-directory: services/api
    steps:
      # Descarcă repo-ul pe runner. Fără acest pas, runner-ul nu are codul.
      # Acțiunile externe sunt fixate pe un commit (SHA), nu pe o etichetă:
      # o etichetă poate fi mutată de autorul acțiunii pe alt cod, un SHA nu.
      - name: Descarca repo-ul
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Instalează uv pe runner.
      - name: Instaleaza uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # Instalează Python și bibliotecile, exact în versiunile din uv.lock.
      # --frozen: eșuează dacă uv.lock nu corespunde cu pyproject.toml,
      # în loc să-l refacă pe loc.
      - name: Instaleaza dependentele
        run: uv sync --frozen

      # Lint: erori și cod suspect.
      - name: Ruff (lint)
        run: uv run ruff check .

      # Formatare: --check doar verifică, nu modifică fișierele.
      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Teste
        run: uv run pytest
  # Caută parole, chei și tokenuri în tot istoricul repo-ului. Rulează în
  # paralel cu jobul api. Aceeași verificare există și la commit, pe laptop,
  # dar acolo poate fi ocolită; aici nu.
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - name: Descarca repo-ul cu tot istoricul
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 0 = toate commit-urile, nu doar ultimul. Un secret șters din
          # fișiere rămâne în istoric și trebuie găsit și acolo.
          fetch-depth: 0

      # Rulează gitleaks din imaginea oficială (v8.30.0), cerută după digest:
      # amprenta conținutului imaginii, care nu poate fi mutată pe altă imagine,
      # spre deosebire de un tag.
      #   -v "$PWD:/repo:ro"  repo-ul de pe runner, vizibil în container, doar pentru citire
      #   git /repo           scanează istoricul git din /repo
      #   --redact            nu afișa în loguri secretele găsite (logurile sunt publice)
      - name: Gitleaks
        run: >
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          git /repo --redact --no-banner
  # Construiește imaginea serviciului api și o publică în ghcr.io.
  # Imaginea are două variante sub același nume: linux/amd64 (noduri din cloud)
  # și linux/arm64 (calculatoare cu procesor ARM, de exemplu Apple Silicon).
  # Fiecare nod descarcă singur varianta potrivită procesorului lui.
  image:
    # Pornește doar dacă ambele joburi de verificare au trecut.
    needs: [api, gitleaks]
    # Publică doar la push pe main: nu la pull request și nu de pe alt branch,
    # indiferent ce declanșatoare are pipeline-ul.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Drepturile tokenului acestui job. Doar aici e nevoie de publicare în
    # registry; celelalte joburi rămân doar cu citirea codului.
    permissions:
      contents: read
      packages: write
    env:
      # Numele imaginii în registry, fără tag.
      IMAGE: ghcr.io/${{ github.repository_owner }}/rag-api
    steps:
      - name: Descarca repo-ul
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runner-ul are procesor amd64. Emulatorul QEMU îi permite să ruleze
      # programe arm64, deci să construiască și varianta arm64 a imaginii.
      # --privileged e necesar: emulatorul se înregistrează în nucleul runner-ului.
      # Imaginea e tonistiigi/binfmt qemu-v10.2.3, cerută după digest.
      - name: Instaleaza emulatorul pentru arm64
        run: >
          docker run --privileged --rm
          tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          --install arm64

      # Builder separat, capabil să construiască pentru mai multe arhitecturi
      # deodată și să urce rezultatul direct în registry.
      # Imaginea e moby/buildkit v0.35.1, cerută după digest.
      - name: Porneste builderul
        run: >
          docker buildx create --use --driver docker-container
          --driver-opt image=moby/buildkit@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
      # Construiește varianta amd64 într-un fișier de pe runner, fără s-o
      # publice, ca să poată fi scanată înaintea publicării.
      - name: Construieste imaginea pentru scanare
        run: >
          docker buildx build
          --platform linux/amd64
          --output "type=docker,dest=$RUNNER_TEMP/image.tar"
          services/api

      # Trivy caută vulnerabilități cunoscute (CVE) în pachetele din imagine:
      # ale sistemului de bază și ale bibliotecilor Python. Baza de date de
      # vulnerabilități e descărcată la fiecare rulare, deci e la zi chiar dacă
      # programul e fixat (Trivy 0.76.2, cerut după digest).
      #   prima rulare:  afișează în log vulnerabilitățile grave și critice
      #   a doua rulare: oprește jobul dacă există cel puțin una critică,
      #                  înainte ca imaginea să fie publicată
      # Folderul trivy-cache păstrează baza de date între cele două rulări.
      - name: Trivy
        env:
          TRIVY: ghcr.io/aquasecurity/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm -v "$RUNNER_TEMP/image.tar:/image.tar:ro" -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" "$TRIVY" image --input /image.tar --severity HIGH,CRITICAL
          docker run --rm -v "$RUNNER_TEMP/image.tar:/image.tar:ro" -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" "$TRIVY" image --input /image.tar --severity CRITICAL --exit-code 1
      # Autentificare la ghcr.io cu tokenul temporar al rulării. Tokenul e dat
      # prin variabilă de mediu și citit de pe stdin, ca să nu apară în
      # linia de comandă și în loguri.
      - name: Autentificare la ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Construiește ambele variante și le urcă. Tag-ul e SHA-ul commit-ului:
      # numele imaginii spune exact din ce cod a fost construită.
      # Eticheta „source" leagă imaginea de repo în interfața GitHub.
      - name: Construieste si publica imaginea
        run: >
          docker buildx build
          --platform linux/amd64,linux/arm64
          --tag "$IMAGE:$GITHUB_SHA"
          --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
          --push
          services/api