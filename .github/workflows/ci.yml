# Pipeline-ul de integrare continuă (CI).
#
# La fiecare push pe main și la fiecare pull request, GitHub pornește o mașină
# virtuală curată (runner), descarcă repo-ul și rulează verificările de mai jos.
# Dacă un pas eșuează, rularea e marcată ca eșuată lângă commit.

# Numele afișat în pagina „Actions" a repo-ului.
name: ci

# Când pornește pipeline-ul.
on:
  push:
    branches: [main]
  pull_request:

# Drepturile tokenului pe care GitHub îl dă automat fiecărei rulări.
# Implicit ar fi mai largi; aici sunt reduse la citirea codului.
permissions:
  contents: read

jobs:
  # Verificările serviciului api: lint, formatare, teste.
  api:
    # Sistemul de operare al runner-ului.
    runs-on: ubuntu-24.04
    # Folderul în care rulează comenzile „run" ale acestui job.
    defaults:
      run:
        working-directory: services/api
    steps:
      # Descarcă repo-ul pe runner. Fără acest pas, runner-ul nu are codul.
      # Acțiunile externe sunt fixate pe un commit (SHA), nu pe o etichetă:
      # o etichetă poate fi mutată de autorul acțiunii pe alt cod, un SHA nu.
      - name: Descarca repo-ul
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Instalează uv pe runner.
      - name: Instaleaza uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # Instalează Python și bibliotecile, exact în versiunile din uv.lock.
      # --frozen: eșuează dacă uv.lock nu corespunde cu pyproject.toml,
      # în loc să-l refacă pe loc.
      - name: Instaleaza dependentele
        run: uv sync --frozen

      # Lint: erori și cod suspect.
      - name: Ruff (lint)
        run: uv run ruff check .

      # Formatare: --check doar verifică, nu modifică fișierele.
      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Teste
        run: uv run pytest
  # Caută parole, chei și tokenuri în tot istoricul repo-ului. Rulează în
  # paralel cu jobul api. Aceeași verificare există și la commit, pe laptop,
  # dar acolo poate fi ocolită; aici nu.
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - name: Descarca repo-ul cu tot istoricul
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 0 = toate commit-urile, nu doar ultimul. Un secret șters din
          # fișiere rămâne în istoric și trebuie găsit și acolo.
          fetch-depth: 0

      # Rulează gitleaks din imaginea oficială (v8.30.0), cerută după digest:
      # amprenta conținutului imaginii, care nu poate fi mutată pe altă imagine,
      # spre deosebire de un tag.
      #   -v "$PWD:/repo:ro"  repo-ul de pe runner, vizibil în container, doar pentru citire
      #   git /repo           scanează istoricul git din /repo
      #   --redact            nu afișa în loguri secretele găsite (logurile sunt publice)
      - name: Gitleaks
        run: >
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          git /repo --redact --no-banner
