# Valorile implicite ale chart-ului „rag".
#
# Șabloanele din templates/ au locuri libere, iar valorile vin de aici.
# Un fișier de valori dat la instalare (helm install -f <fișier>) le poate
# înlocui pe oricare dintre ele; ce nu e înlocuit rămâne ca aici.

# Setările serviciului api.
api:
  # Câte poduri identice rulează.
  replicas: 2
  image:
    # Numele imaginii, fără tag: adresa registry-ului (ghcr.io), contul
    # și numele imaginii. De aici o descarcă nodurile clusterului.
    repository: ghcr.io/isaiagabriel-personal/rag-api
    # Versiunea imaginii: SHA-ul commit-ului din care a fost construită.
    # Nu are valoare implicită; se dă la instalare cu
    # --set api.image.tag=<sha>, altfel instalarea se oprește cu eroare.
    tag: ""
